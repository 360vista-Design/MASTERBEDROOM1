<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Bedroom | 360° Virtual Tour</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #panorama {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="panorama"></div>

<script>
  pannellum.viewer('panorama', {
    type: 'equirectangular',
    panorama: 'MASTER1-360.png',
    autoLoad: true,
    showZoomCtrl: true,
    compass: false,
    mouseZoom: true,
    draggable: true,
    hfov: 100
  });
</script>

</body>
</html>
